<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4532a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a03d1f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#terracotta)" />
  <!-- Trishul (trident) symbol -->
  <g stroke="#f5e6d3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Central prong -->
    <path d="M50 70 L50 30" />
    <!-- Left prong -->
    <path d="M35 70 L35 38" />
    <!-- Right prong -->
    <path d="M65 70 L65 38" />
    <!-- Crossbar connecting prongs -->
    <path d="M35 38 L65 38" />
    <!-- Base decoration -->
    <ellipse cx="50" cy="72" rx="18" ry="4" />
  </g>
  <!-- Small dot at top (bindi/tilak) -->
  <circle cx="50" cy="26" r="3" fill="#f5e6d3" />
</svg>